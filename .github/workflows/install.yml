name: Build Release

# 打包发布：打 tag（v*）时自动出包并挂到 GitHub Release 上。
# 手动触发也行（Actions 页面点 Run workflow，填一个版本号）。
#
# 与官方 MaaPracticeBoilerplate 的 install.yml 的主要差异：
#   1. 只出 windows-x86_64 一个产物 —— 本项目的控制器只有 Adb(安卓模拟器) 和 Win32(桌面窗口)，
#      后者的 screencap/mouse 实现是 PrintWindow + SendMessage，离开 Windows 没有意义；
#      runtimes/ 目录也只有 win-x64。
#   2. 不需要从 GitHub 下载 MaaFramework 原生库和 MFAAvalonia —— 这两个已经在仓库里了
#      （runtimes/ libs/ plugins/ 与官方 v2.16.6 发布包逐字节一致），省掉两步网络依赖。
#   3. 多了「准备嵌入式 Python」一步 —— agent 用 cv2/numpy/PIL/openpyxl，不能让用户自己装。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 0.1.0'
        required: true
        default: '0.1.0'

env:
  PY_VERSION: '3.13.17'
  PY_EMBED_URL: 'https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip'
  PY_EMBED_SIZE: '11441267'
  # 2026-11-25 两轮 CI 都挂在「校验 OCR 模型」，根因是 windows-latest 上 Python 的
  # stdout 被 pwsh 接管成管道后编码退化成 cp1252，tools/configure.py 第一句
  # print 中文就抛 UnicodeEncodeError 退出 1（本地代码页 936 能编中文，复现不出来）。
  # 脚本里已各自 reconfigure 成 utf-8，这里再加一道全局兜底，覆盖所有 step 的 python 调用。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # 先算版本号，后面两个 job 都用
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v${VERSION}"

          # alpha/beta/rc/dev 或 -ci. 结尾的判为预发布
          if echo "$VERSION" | grep -qiE 'alpha|beta|rc|dev|-ci\.'; then
            PRE=true
          else
            PRE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION  tag: $TAG  预发布: $PRE"

  build:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: 安装构建期 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # build.py 自身要用 Pillow（把 logo.png 转成 Assets/logo.ico、以及往 exe 里写
      # 图标资源），它跑的是这个 setup-python 解释器，**不是**下面那个嵌入式 python。
      # 2026-11-25 run 45541810755 就是这么挂的：ModuleNotFoundError: No module named
      # 'PIL' → Assets/logo.ico 没生成 → 自检 FAIL 不产出 zip。开发机上 .venv 装了
      # Pillow，所以本地永远复现不出来。
      - name: 给构建期 Python 装 Pillow
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=11,<14"
          python -c "import PIL; print('PIL', PIL.__version__)"

      # ---------------------------------------------------------------
      # 第一步：准备嵌入式 Python（这是官方模板没有的一步）
      # 为什么不用 setup-python 那个解释器直接进包：
      #   setup-python 装的是完整运行时（含 Doc/include/tcl，约 110 MB），
      #   官方 embeddable 只有 21.6 MB，且它的 _pth 机制天然从包内相对路径找库，
      #   不会像 venv 那样把 home 指向构建机的绝对路径（用户换机器就废）。
      # ---------------------------------------------------------------
      - name: 下载嵌入式 Python
        shell: pwsh
        run: |
          $url = "$env:PY_EMBED_URL"
          $dst = "py-embed.zip"
          $expect = [int]$env:PY_EMBED_SIZE

          # python.org 偶尔会断流，续传重试几次；最后按字节数硬校验
          for ($i = 1; $i -le 6; $i++) {
            $cur = if (Test-Path $dst) { (Get-Item $dst).Length } else { 0 }
            if ($cur -eq $expect) { break }
            Write-Host "第 $i 次下载，已有 $cur / $expect B"
            curl.exe -sL --max-time 120 -C - -o $dst $url
          }

          $got = (Get-Item $dst).Length
          if ($got -ne $expect) {
            Write-Error "下载不完整: $got != $expect"
            exit 1
          }
          Write-Host "下载完成 $got B"
          Get-FileHash $dst -Algorithm SHA256 | Format-List

      - name: 解压嵌入式 Python
        shell: pwsh
        run: |
          Expand-Archive py-embed.zip -DestinationPath python -Force
          # _pth 决定 sys.path；加上 Lib\site-packages 并启用 site 才能 import 第三方库
          $pth = Get-ChildItem python -Filter 'python*._pth' | Select-Object -First 1
          @('python313.zip', '.', 'Lib\site-packages', 'import site') |
            Set-Content -Path $pth.FullName -Encoding ascii
          Write-Host "--- $($pth.Name) ---"
          Get-Content $pth.FullName
          & python\python.exe -c "import sys; print(sys.version, sys.prefix)"

      - name: 安装运行依赖到嵌入式 Python
        shell: pwsh
        run: |
          $sp = "python\Lib\site-packages"
          New-Item -ItemType Directory -Force -Path $sp | Out-Null
          # 用构建机上的正式 Python 的 pip，往 --target 里装（embeddable 自身不带 pip）
          python -m pip install --upgrade pip
          python -m pip install --target $sp -r tools\requirements.txt
          Write-Host "site-packages:"
          $i = Get-ChildItem $sp -Recurse -File
          Write-Host ("  {0} files, {1:N1} MB" -f $i.Count, (($i | Measure-Object Length -Sum).Sum / 1MB))

      - name: 自检依赖可 import
        shell: pwsh
        run: |
          # 注意：这里**不能**设 MAAFW_BINARY_PATH。maa 包在没有这个环境变量时会用它自带的
          # Lib\site-packages\maa\bin，那才是最终用户运行时的真实路径。
          # 早先这里写 $env:MAAFW_BINARY_PATH = "$PWD\maafw"，但 maafw/ 只在开发者本机存在
          # （.gitignore:49 已忽略），CI checkout 出来没有它，这步必然抛
          # FileNotFoundError: `<install>/maafw` does not exist.，整个 build 挂掉。
          if (Test-Path Env:\MAAFW_BINARY_PATH) { Remove-Item Env:\MAAFW_BINARY_PATH }
          & python\python.exe -c "import numpy,cv2,PIL,openpyxl,jsonschema,maa; print('all imports OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 清掉 import 现场生成的 pyc
        shell: pwsh
        run: |
          # 上一步的 import 会在 python\Lib\site-packages 下写一堆 __pycache__。
          # build.py 的 copytree 只跳源目录里的 __pycache__，理论上拷不到包里去，
          # 但这里先清一遍，让「源 python/ 干净」成为事实而不是推断。
          $pyc = Get-ChildItem python -Recurse -File -Include *.pyc,*.pyo -ErrorAction SilentlyContinue
          $n = ($pyc | Measure-Object).Count
          if ($n -gt 0) { $pyc | Remove-Item -Force }
          # 空掉的 __pycache__ 也删掉，避免残留空目录进 zip
          Get-ChildItem python -Recurse -Directory -Filter __pycache__ -ErrorAction SilentlyContinue |
            Where-Object { -not (Get-ChildItem $_.FullName -Force) } |
            Remove-Item -Force -Recurse
          Write-Host "清理源 python/ 的 pyc: $n 个"
          $left = (Get-ChildItem python -Recurse -File -Include *.pyc,*.pyo -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "复查剩余 pyc: $left"
          if ($left -ne 0) { Write-Error "源 python/ 仍有 pyc"; exit 1 }

      - name: 校验 OCR 模型
        shell: pwsh
        run: |
          # 失败时把具体原因打成 annotation。否则 Actions 只报
          # "Process completed with exit code 1"，日志下载接口要鉴权、
          # 本地取不到，排障时完全看不出是哪个文件、差多少字节。
          $out = & python tools\configure.py --check 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          # 行尾转换是已知风险（2026-11-25 run 45537166342），把相关配置一起打出来
          Write-Host ("  core.autocrlf = {0}" -f (git config --get core.autocrlf))
          Write-Host ("  .gitattributes 存在 = {0}" -f (Test-Path .gitattributes))
          Write-Host ("  keys.txt attr  = {0}" -f ((git check-attr text eol binary -- resource/model/ocr/keys.txt) -join ' | '))
          # 无论成败都打印实际字节数，方便与 configure.py 的 EXPECT 对照
          foreach ($n in @('det.onnx', 'rec.onnx', 'keys.txt')) {
            $f = Join-Path 'resource/model/ocr' $n
            if (Test-Path $f) {
              Write-Host ("  {0,-10} {1,12} B" -f $n, (Get-Item $f).Length)
            } else {
              Write-Host ("  {0,-10} 缺失" -f $n)
            }
          }
          if ($code -ne 0) {
            $msg = ($out | Out-String).Trim() -replace "`r?`n", " / "
            if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
            Write-Host "::error title=OCR 校验失败::$msg"
            exit 1
          }

      - name: 确认构建目录是干净的
        shell: pwsh
        run: |
          # copytree 是覆盖式写入，目标里源没有的文件不会被删。只要 install/ 里留着上一次
          # 的残留（pyc、已删模块、旧资源），它就会原样进 zip —— 2026-11-24 那版产物里
          # 325 个 pyc 就是这么来的。CI 是全新 checkout，正常情况下这里什么都不该有；
          # 真出现了就说明有缓存或上一步异常，必须停下。
          foreach ($d in @('install', 'dist')) {
            if (Test-Path $d) {
              $f = Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue
              Write-Host "$d 已存在: $($f.Count) 文件 —— 删除"
              Remove-Item $d -Recurse -Force
            } else {
              Write-Host "$d 不存在（符合预期）"
            }
          }

      - name: 打包
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.version }}"
          python tools\build.py $ver win x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - name: 核对产物
        shell: pwsh
        run: |
          # build.py 自己会验（verify_zip），这里再独立验一遍，防止 build.py 被改坏
          # 或有人绕过它直接传旧 zip。判据：条目数 > 2000、pyc=0、无反斜杠、含关键件。
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Error "dist 下没有 zip"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $a = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = $a.Entries | ForEach-Object { $_.FullName }
            $n = $names.Count
            $pyc = ($names | Where-Object { $_ -match '__pycache__' -or $_ -like '*.pyc' -or $_ -like '*.pyo' }).Count
            $bslash = ($names | Where-Object { $_ -like '*\*' }).Count
            $root = ($names | Where-Object { $_ -notmatch '/' }).Count
            Write-Host "zip: $($zip.Name)  $([math]::Round($zip.Length/1MB,1)) MB  $n 条目"
            Write-Host "  pyc=__pycache__ : $pyc"
            Write-Host "  反斜杠条目      : $bslash"
            Write-Host "  根级条目(无/)   : $root"
            $missing = @()
            # 单套 MaaFramework：原生库只在 runtimes 一处，maa/bin 里不应再有 dll
            # Assets/logo.ico 在这里是**硬要求**：build.py 只在没有 Pillow 时才会跳过它，
            # 而 CI 已经装了 Pillow（见「给构建期 Python 装 Pillow」）。所以这个包里
            # 缺图标 = Pillow 那一步没生效，属于该拦的构建异常；本地开发机没装 Pillow
            # 时跳过图标是允许的，两种口径的差别就在这里。
            foreach ($k in @('interface.json','runtimes/win-x64/native/MaaFramework.dll',
                             'runtimes/win-x64/native/MaaAgentServer.dll',
                             'python/python.exe','config/config.template.json',
                             'Assets/logo.ico',
                             'resource/model/ocr/det.onnx','data/digits/d0.png',
                             'README.md','LICENSE')) {
              if ($names -notcontains $k) { $missing += $k }
            }
            if ($missing.Count -gt 0) { Write-Host "  缺关键件: $($missing -join ', ')" }

            # 反面判据：第二套原生库与运行期残留都不该出现。
            # 注意排除 plugins/ —— maa/bin/plugins/MaaPluginDemo.dll 是随包分发的
            # 插件示例，不是原生库，路径同样以 maa/bin/ 开头，不排除就会误报。
            $dup = ($names | Where-Object {
              $_ -like 'python/Lib/site-packages/maa/bin/*.dll' -and $_ -notlike '*/plugins/*'
            }).Count
            $junk = ($names | Where-Object {
              $_ -eq 'appsettings.json' -or $_ -eq 'config/config.json' -or
              $_ -like 'config/instances/*' -or
              $_ -match '^(debug|logs|report|temp|backup)/'
            }).Count
            Write-Host "  maa/bin 残留 dll : $dup"
            Write-Host "  运行期残留       : $junk"
            $fail = $false
            if ($n -lt 2000)  { Write-Host "! 条目数过少"; $fail = $true }
            if ($pyc -ne 0)   { Write-Host "! 有 pyc 泄漏"; $fail = $true }
            if ($bslash -ne 0){ Write-Host "! 有反斜杠路径"; $fail = $true }
            if ($missing.Count -gt 0) { Write-Host "! 缺关键件"; $fail = $true }
            if ($dup -ne 0)   { Write-Host "! 仍有两套 MaaFramework（maa/bin 里还有 dll）"; $fail = $true }
            if ($junk -ne 0)  { Write-Host "! 有运行期残留"; $fail = $true }
            if ($fail) { exit 1 }
            Write-Host "产物核对通过"
          } finally { $a.Dispose() }

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 物华弥新MAA-win-x86_64-${{ needs.meta.outputs.tag }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [meta, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 摊平产物
        run: |
          find artifacts -name '*.zip' -exec mv {} . \;
          ls -lh *.zip

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: '*.zip'
          generate_release_notes: true
          body: |
            ## 使用说明

            1. 下载下方 `物华弥新MAA-v*-win-x86_64.zip`
            2. **解压到纯英文路径**（中文路径可能让 MaaFramework 找不到资源）
            3. 双击 `物华弥新MAA.exe`
            4. 首次运行需要在设置里指定 MuMu 的 adb 路径，或先 `adb connect 127.0.0.1:16384`

            ## 环境要求

            - Windows 10 / 11 x64
            - .NET 10 Runtime
            - MuMu 模拟器，分辨率设为 1280×720（MaaFramework 按 720p 画布识别）
            - 游戏包名 `com.cipaishe.laigu`

            ## 已内置

            - MFAAvalonia v2.16.6（通用 UI）
            - MaaFramework 5.16.1 原生库（单套，在 `runtimes/win-x64/native/`）
            - PP-OCRv6 OCR 模型
            - 嵌入式 Python 3.13 + 全部运行依赖（无需另装 Python）
